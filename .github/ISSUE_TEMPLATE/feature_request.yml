name: Feature request
description: Propose a focused enhancement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Engineering need
      description: Explain the problem or workflow this would improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, conventions, and expected validation.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Technical references
      description: Link applicable papers, standards, or benchmark data.
