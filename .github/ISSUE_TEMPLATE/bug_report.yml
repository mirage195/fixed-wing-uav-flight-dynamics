name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not report flight-safety incidents here.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command and a minimal non-sensitive configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      render: shell
