[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-wing-uav-flight-dynamics"
version = "0.1.0"
description = "Validated trim, linear flight-dynamics, modal analysis, and simulation for fixed-wing UAVs"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Harshit Beri", email = "harshit04beri@gmail.com"},
]
keywords = [
    "aerospace",
    "flight-dynamics",
    "fixed-wing",
    "stability-analysis",
    "uav",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scipy>=1.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "twine>=5.0",
]

[project.scripts]
uav-dynamics = "fixed_wing_uav.cli:main"

[project.urls]
Homepage = "https://github.com/mirage195/fixed-wing-uav-flight-dynamics"
Documentation = "https://github.com/mirage195/fixed-wing-uav-flight-dynamics/tree/main/docs"
Issues = "https://github.com/mirage195/fixed-wing-uav-flight-dynamics/issues"
Repository = "https://github.com/mirage195/fixed-wing-uav-flight-dynamics.git"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fixed_wing_uav*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fixed_wing_uav"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
